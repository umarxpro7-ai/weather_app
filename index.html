<!DOCTYPE html>
<html>
<head>
    <link href="https://cdn.jsdelivr.net/npm/typeface-minecraft@1.0.0/index.min.css" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="card">
    <div class="search">
        <input type="text" placeholder="enter city name"spellcheck="false">
        <button><img src="images/search.png" alt="search"></button>
    </div>
    <div class="error">
        <p>invalid city name</p>
    </div>
    <div class="weather">
        <img src="images/rain.png" class="weather-icon">
        <h1 class="temp">22°C</h1>
        <h2 class="city">new york</h2>
        <div class="details">
            <div class="col">
                <img src="images/humidity.png">
                <div>
                    <p class="humidity">50%</p>
                    <p>Humidity</p>
                </div>
            </div>
            <div class="col">
                <img src="images/wind.png">
                <div>
                    <p class="wind">15 km/hr</p>
                    <p>Wind Speed</p>
                </div>
            </div>
        </div>
    </div>
</div>

<script>

const apiKey = "e26bb7800e1be45c3c722f8abf41f102";
const apiUrl = "https://api.openweathermap.org/data/2.5/weather?units=metric&q=";

const searchBox = document.querySelector(".search input");
const searchBtn = document.querySelector(".search button");
const weatherIcon = document.querySelector(".weather-icon");
const clickSound = new Audio("images/click.mp3.mp3")
function playClickSound() {
    clickSound.currentTime = 0;
    clickSound.play().catch(error => {
        console.error("audio playback error:", error);
    });
}

async function checkWeather(city) {
    if (!city.trim()) return;

    const response = await fetch(apiUrl + encodeURIComponent(city) + `&appid=${apiKey}`);

    if (response.status == 404) {
        document.querySelector(".error").style.display = "block";
        document.querySelector(".weather").style.display = "none";
    } else {
    const data = await response.json();

    document.querySelector(".city").innerHTML = data.name;
    document.querySelector(".temp").innerHTML = Math.round(data.main.temp) + "°C";
    document.querySelector(".humidity").innerHTML = data.main.humidity + "%";
    document.querySelector(".wind").innerHTML = data.wind.speed + " km/h";

    const condition = data.weather[0].main;
    const iconMap = {
        "Clouds": "images/clouds.png",
        "Clear": "images/clear2.png",
        "Rain": "images/rain.png",
        "Drizzle": "images/drizzle.png",
        "Mist": "images/mist.png",
        "Snow": "images/snow.png"
    };

    weatherIcon.src = iconMap[condition] || "images/clear.png";

document.querySelector(".weather").style.display = "block";
document.querySelector(".error").style.display = "none";
    }
}


searchBtn.addEventListener("click", ()=>{
    playClickSound();
    checkWeather(searchBox.value);
});

searchBox.addEventListener("keydown", (event) => {
    if (event.key === "Enter") {
        playClickSound();
        checkWeather(searchBox.value);
    }
});

searchBtn.addEventListener("click", () => {
    if (searchBox.value.trim() !== "") {
        checkWeather(searchBox.value);
    }
});

</script>


</body>
</html>
